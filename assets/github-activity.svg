<svg xmlns="http://www.w3.org/2000/svg" width="540" height="392" viewBox="0 0 540 392" role="img" aria-labelledby="t d">
<title id="t">GitHub activity, last 30 days</title>
<desc id="d">5,187 commits, 527 pull requests opened, 525 merged, 39-day streak.</desc>
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.title { fill: #67e8f9; font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.sub, .muted, .axis, .xpl { fill: #94a3b8; }
.sub { font-size: 11px; }
.big { fill: #e5edf6; font-size: 46px; font-weight: 700; letter-spacing: -.5px; }
.unit { fill: #94a3b8; font-size: 13px; font-weight: 500; }
.delta { font-size: 11px; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .8px; }
.xpl { font-size: 11px; }
.xpl tspan.b { fill: #e5edf6; font-weight: 600; }
.statv { fill: #e5edf6; font-size: 18px; font-weight: 700; }
.statl { fill: #94a3b8; font-size: 10px; }
.axis { font-size: 10px; fill: #64748b; }
.foot { font-size: 10px; fill: #64748b; }
.box, .fx, .bar { transform-box: fill-box; }

.in { animation: fade 700ms ease-out both; }
.arrive { transform-origin: center; animation: arrive 750ms cubic-bezier(.3,1.5,.5,1) both; }
.bob { animation: bob 3.2s ease-in-out infinite; }
.sigh { transform-origin: center; animation: sigh 6s ease-in-out infinite; }
.dot { animation: dot 6s ease-in-out infinite; }
.bounce { transform-origin: center bottom; animation: bounce 2.4s cubic-bezier(.3,.7,.4,1) infinite; }
.sparkle { transform-origin: center; animation: twinkle 1.8s ease-in-out infinite both; }
.glow { transform-origin: center; animation: glow 1.3s ease-in-out infinite alternate; }
.glow.fast { animation-duration: .8s; }
.heat { animation: heat .18s ease-in-out infinite alternate; }
.flame { transform-origin: center bottom; animation: flicker .9s ease-in-out infinite alternate; }
.wave { transform-origin: center; animation: wave 2.4s cubic-bezier(.2,.8,.2,1) infinite both; }
.boom { transform-origin: center; animation: boom 2.4s ease-out infinite both; }
.jolt { transform-origin: center; animation: jolt 2.4s ease-out infinite; }
.spin { transform-origin: center; animation: spin 2.4s linear infinite; }
.bolt { transform-origin: center; animation: flash 2.3s linear infinite; }
.power { transform-origin: center; animation: power 2.6s linear infinite; }
.aura { animation: aura 1.6s ease-in-out infinite alternate; }
.xpfill { transform-origin: left center; animation: fill 1.4s cubic-bezier(.2,.8,.2,1) 300ms both; }
.shine { animation: shine 2.8s ease-in-out 1.6s infinite; }
.bar { transform-origin: center bottom; animation: grow 800ms cubic-bezier(.2,.8,.2,1) both; }
.bar.today { animation: grow 800ms cubic-bezier(.2,.8,.2,1) both, pulse 1.6s ease-in-out 1.4s infinite; }
.count { animation: rise 900ms cubic-bezier(.2,.8,.2,1) 150ms both; }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes arrive { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes sigh { 0%, 62%, 100% { transform: none; } 72%, 88% { transform: rotate(-9deg) translateY(2px); } }
@keyframes dot { 0%, 64%, 100% { opacity: 0; } 72%, 90% { opacity: 1; } }
@keyframes bounce { 0%, 100% { transform: none; } 20% { transform: translateY(-7px) scale(1.04); } 40% { transform: none; } }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(60deg); } }
@keyframes glow { from { opacity: .55; transform: scale(.92); } to { opacity: 1; transform: scale(1.08); } }
@keyframes heat { from { transform: translateY(0); } to { transform: translateY(-1px) rotate(.6deg); } }
@keyframes flicker { from { transform: scale(.9, .85) translateY(1px); opacity: .8; } to { transform: scale(1.1, 1.3) translateY(-3px); opacity: 1; } }
@keyframes wave { from { transform: scale(.5); opacity: .95; } to { transform: scale(1.65); opacity: 0; } }
@keyframes boom { 0% { transform: scale(.5); opacity: .9; } 14%, 100% { transform: scale(1.5); opacity: 0; } }
@keyframes jolt { 0%, 26%, 100% { transform: none; } 4% { transform: scale(1.2); } 9% { transform: translate(-3px, 1px) scale(1.06); } 14% { transform: translate(3px, -1px); } 19% { transform: translate(-1px, 0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0%, 84%, 100% { opacity: 0; transform: scale(.6); } 87% { opacity: 1; transform: scale(1.2); } 91% { opacity: .15; } 94% { opacity: 1; transform: scale(1); } }
@keyframes power { 0%, 58%, 100% { transform: none; } 60%, 64%, 68%, 72%, 76% { transform: translate(-1.5px, 1px) scale(1.04); } 62%, 66%, 70%, 74% { transform: translate(1.5px, -1px) scale(1.04); } }
@keyframes aura { from { opacity: .45; } to { opacity: 1; } }
@keyframes fill { from { transform: scaleX(0); } }
@keyframes shine { from { transform: translateX(-200px); } 60%, to { transform: translateX(560px); } }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<linearGradient id="xp" x1="0" x2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="fire"><stop offset="0" stop-color="#fb923c" stop-opacity=".55"/><stop offset=".66" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
