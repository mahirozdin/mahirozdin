<linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f87171"/><stop offset=".2" stop-color="#fbbf24"/><stop offset=".4" stop-color="#4ade80"/><stop offset=".6" stop-color="#22d3ee"/><stop offset=".8" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
